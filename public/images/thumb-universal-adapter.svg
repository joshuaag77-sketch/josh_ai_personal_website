<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bgUA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1733"/>
      <stop offset="100%" stop-color="#0f1a2e"/>
    </linearGradient>
    <radialGradient id="glowUA" cx="62%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="agentUA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </radialGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bgUA)"/>
  <ellipse cx="250" cy="110" rx="140" ry="90" fill="url(#glowUA)"/>

  <!-- bench grid -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="215" x2="400" y2="215"/>
    <line x1="0" y1="230" x2="400" y2="230"/>
  </g>

  <!-- three machines, each a different silhouette -->
  <!-- microscope -->
  <g fill="#cbd5e1">
    <rect x="52" y="180" width="56" height="10" rx="2"/>
    <rect x="60" y="130" width="10" height="52" rx="2" fill="#334155"/>
    <rect x="66" y="128" width="30" height="8" rx="2" fill="#334155"/>
    <rect x="84" y="136" width="10" height="34" rx="4"/>
    <rect x="76" y="166" width="26" height="4" rx="1" fill="#94a3b8"/>
  </g>
  <!-- 3D printer -->
  <g>
    <rect x="166" y="130" width="60" height="60" rx="3" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="176" y="150" width="40" height="4" fill="#94a3b8"/>
    <path d="M198 154 l0 8 l4 6 l-8 0 l4 -6 z" fill="#c8a87a"/>
    <rect x="186" y="172" width="24" height="12" rx="3" fill="#f59e0b"/>
  </g>
  <!-- robot arm -->
  <g stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M320 186 L330 150 L358 132"/>
  </g>
  <circle cx="330" cy="150" r="6" fill="#f59e0b"/>
  <rect x="300" y="184" width="46" height="8" rx="3" fill="#334155"/>

  <!-- MHS adapters, the same amber block on every port -->
  <g fill="#f59e0b">
    <rect x="34" y="160" width="18" height="12" rx="2"/>
    <rect x="226" y="160" width="18" height="12" rx="2"/>
    <rect x="352" y="170" width="18" height="12" rx="2"/>
  </g>
  <g fill="#0b1120">
    <rect x="40" y="163" width="6" height="3"/>
    <rect x="232" y="163" width="6" height="3"/>
    <rect x="358" y="173" width="6" height="3"/>
  </g>

  <!-- one agent, one line to each adapter -->
  <g stroke="#f59e0b" stroke-width="1.2" opacity="0.8">
    <line x1="200" y1="58" x2="43" y2="160"/>
    <line x1="200" y1="58" x2="235" y2="160"/>
    <line x1="200" y1="58" x2="361" y2="170"/>
  </g>
  <circle cx="200" cy="58" r="14" fill="url(#agentUA)"/>
  <circle cx="200" cy="58" r="20" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.55"/>

  <!-- the label, written for a model to read -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#94a3b8">
    <rect x="250" y="20" width="126" height="40" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="258" y="33" fill="#f59e0b" letter-spacing="0.5">ROBOT ARM · MHS</text>
    <text x="258" y="45">mass 12 kg · reach 850 mm</text>
    <text x="258" y="55">safe ≤ 0.3 m/s near samples</text>
  </g>
</svg>
